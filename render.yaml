# ==============================================================================
# RENDER BLUEPRINT INFRASTRUCTURE AS CODE (IaC) - KOLIX BACKEND
# Doc: https://render.com/docs/blueprint-spec
# ==============================================================================
version: "1"

services:
  # ----------------------------------------------------------------------------
  # 1. ENVIRONNEMENT PRODUCTION (Branche : main)
  # ----------------------------------------------------------------------------
  - type: web
    name: kolix-backend-prod
    runtime: docker
    repo: https://github.com/kolix225-code/kolix_backend
    branch: main
    plan: free # 100% Gratuit / Freemium (aucune carte bancaire requise)
    region: frankfurt # Francfort (faible latence vers l'Afrique de l'Ouest / Europe)
    dockerContext: .
    dockerfilePath: Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: PORT
        value: "8000"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      # URL de la base de données Supabase (Pooler transaction 6543 pour l'API)
      - key: DATABASE_URL
        sync: false
      # URL Directe Supabase (Session pooler 5432 pour les migrations Alembic)
      - key: DIRECT_URL
        sync: false
      - key: BACKEND_CORS_ORIGINS
        value: "https://kolix.ci,https://kolix-frontend.onrender.com,https://kolix-kohl.vercel.app,https://kolix.vercel.app,*"
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        value: "noreply@kolix.ci"
      - key: BREVO_SENDER_NAME
        value: "Kolix"
      - key: AUTO_SEED
        value: "false"
      - key: SKIP_MIGRATIONS
        value: "false"

  # ----------------------------------------------------------------------------
  # 2. ENVIRONNEMENT PRÉPRODUCTION / STAGING (Branche : ppd)
  # ----------------------------------------------------------------------------
  - type: web
    name: kolix-backend-ppd
    runtime: docker
    repo: https://github.com/kolix225-code/kolix_backend
    branch: ppd
    plan: free # Plan gratuit pour les tests de préproduction
    region: frankfurt
    dockerContext: .
    dockerfilePath: Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: staging
      - key: DEBUG
        value: "true"
      - key: PORT
        value: "8000"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: BACKEND_CORS_ORIGINS
        value: "*"
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        value: "noreply@kolix.ci"
      - key: BREVO_SENDER_NAME
        value: "Kolix"
      - key: AUTO_SEED
        value: "true"
      - key: SKIP_MIGRATIONS
        value: "false"

