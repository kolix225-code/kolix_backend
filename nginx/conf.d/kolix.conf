# Configuration Nginx pour Kolix Production API

upstream kolix_backend_cluster {
    server api:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# Limite de requêtes (Protection DDoS & Brute-force sur le checkout et l'auth)
limit_req_zone $binary_remote_addr zone=api_rate_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=checkout_rate_limit:10m rate=5r/s;

server {
    listen 80;
    listen [::]:80;
    server_name api.kolix.ci *.kolix.shop;

    # Redirection HTTP vers HTTPS (en production avec certificat)
    # return 301 https://$host$request_uri;

    client_max_body_size 15M;

    # En-têtes de sécurité recommandés
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Health check public pour les load balancers
    location /health {
        proxy_pass http://kolix_backend_cluster/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    # Tunnel de checkout COD ultra-rapide avec rate-limiting
    location /api/v1/public/orders/checkout {
        limit_req zone=checkout_rate_limit burst=10 nodelay;
        proxy_pass http://kolix_backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API Standard
    location / {
        limit_req zone=api_rate_limit burst=50 nodelay;
        proxy_pass http://kolix_backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}

